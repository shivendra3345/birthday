<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    :root {
      color-scheme: light;
      --bg-start: #fff1f2;
      --bg-end: #e0f2fe;
      --card-bg: rgba(255, 255, 255, 0.88);
      --text-main: #1f2937;
      --text-soft: #4b5563;
      --accent: #ec4899;
      --accent-dark: #db2777;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    }

    .card {
      width: min(100%, 720px);
      padding: 48px 32px;
      border-radius: 28px;
      text-align: center;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .emoji {
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 12px;
      animation: float 2.6s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      line-height: 1.1;
    }

    .name {
      color: var(--accent-dark);
    }

    p {
      margin: 18px auto 0;
      max-width: 34rem;
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-soft);
    }

    button {
      margin-top: 28px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(236, 72, 153, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(236, 72, 153, 0.35);
    }

    button:focus-visible {
      outline: 3px solid rgba(139, 92, 246, 0.35);
      outline-offset: 4px;
    }

    .surprise {
      min-height: 1.8rem;
      margin-top: 18px;
      font-weight: 700;
      color: var(--accent-dark);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🎉🎂🎈</div>
    <h1>Happy Birthday, <span class="name">My Dear Friend</span>!</h1>
    <p>
      Wishing you a day filled with smiles, laughter, cake, and all the happiness you deserve.
      May this year bring you unforgettable memories and countless reasons to celebrate.
    </p>
    <button type="button" id="surprise-button">Open a Birthday Surprise</button>
    <div class="surprise" id="surprise-message" aria-live="polite"></div>
  </main>

  <script>
    const messages = [
      "You make life brighter just by being in it ✨",
      "Hope your birthday is as amazing as you are 💖",
      "Cheers to more fun, joy, and beautiful memories 🎊"
    ];

    let messageIndex = 0;

    document.getElementById("surprise-button").addEventListener("click", () => {
      document.getElementById("surprise-message").textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;
    });
  </script>
</body>
</html>
